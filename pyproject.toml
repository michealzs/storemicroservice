[project]
name = "ai-commerce-service"
version = "0.1.0"
description = "FastAPI + LangChain/LangGraph commerce service with a RAG shopping assistant (converted from a Django store microservice)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "stripe>=9.0",
    # --- LLM / agent stack ---
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-openai>=0.1",
    "langchain-anthropic>=0.1",
    "langgraph>=0.1",
    "langchain-postgres>=0.0.9",
    "langsmith>=0.1",
    "langfuse>=2.0",
    # --- optional vector backends ---
    "langchain-weaviate>=0.0.2",
    "weaviate-client>=4.5",
    "langchain-pinecone>=0.1",
    "pinecone-client>=4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
